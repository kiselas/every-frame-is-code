# Publishes the films to GitHub Pages: each page draws every frame live in the browser.
# / is examples/demo/demo.html, /gps/ and /pixel/ are examples/gps/film.html and examples/pixel/film.html folded
# into one file by runtime/inline.mjs; social preview tags are added at build time.
name: pages
on:
  push:
    branches: [main]
    paths: ['examples/demo/**', 'examples/gps/**', 'examples/pixel/**', 'runtime/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: https://kiselas.github.io/every-frame-is-code/
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp examples/demo/stills/04-sphere.jpg _site/preview.jpg
          desc="A one-minute film drawn entirely by code in your browser. Made with motion-kit, an Agent Skill for Claude Code, Codex and ChatGPT."
          meta="<meta name=\"description\" content=\"$desc\">\n<meta property=\"og:title\" content=\"motion-kit · every frame is code\">\n<meta property=\"og:description\" content=\"$desc\">\n<meta property=\"og:image\" content=\"${SITE_URL}preview.jpg\">\n<meta property=\"og:url\" content=\"$SITE_URL\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">"
          sed "s|</title>|</title>\n$meta|" examples/demo/demo.html > _site/index.html
          grep -q 'og:image' _site/index.html
          # the GPS film: one self-contained page
          mkdir -p _site/gps
          cp examples/gps/preview.jpg _site/gps/preview.jpg
          gps_url="${SITE_URL}gps/"
          gps_desc="Four Clocks: a 90-second explainer on how GPS finds you, drawn entirely by code in your browser. Made with motion-kit."
          cat > _site/gps/meta.html <<'META'
          <meta name="description" content="@DESC@">
          <meta property="og:title" content="Four Clocks · how GPS finds you">
          <meta property="og:description" content="@DESC@">
          <meta property="og:image" content="@URL@preview.jpg">
          <meta property="og:url" content="@URL@">
          <meta name="twitter:card" content="summary_large_image">
          META
          sed -i "s|@DESC@|$gps_desc|; s|@URL@|$gps_url|" _site/gps/meta.html
          node runtime/inline.mjs examples/gps/film.html _site/gps/film.html
          sed '/<\/title>/r _site/gps/meta.html' _site/gps/film.html > _site/gps/index.html
          rm _site/gps/film.html _site/gps/meta.html
          grep -q 'og:image' _site/gps/index.html
          grep -q 'inlined: ../../runtime/film.js' _site/gps/index.html
          # the pixel film: one self-contained page
          mkdir -p _site/pixel
          cp examples/pixel/preview.jpg _site/pixel/preview.jpg
          pixel_url="${SITE_URL}pixel/"
          pixel_desc="Sixteen Colors: a 64-second pixel film drawn entirely by code in your browser: palettes, dithering, Mode 7, demoscene effects and a chiptune score. Made with motion-kit."
          cat > _site/pixel/meta.html <<'META'
          <meta name="description" content="@DESC@">
          <meta property="og:title" content="Sixteen Colors · a pixel film made of code">
          <meta property="og:description" content="@DESC@">
          <meta property="og:image" content="@URL@preview.jpg">
          <meta property="og:url" content="@URL@">
          <meta name="twitter:card" content="summary_large_image">
          META
          sed -i "s|@DESC@|$pixel_desc|; s|@URL@|$pixel_url|" _site/pixel/meta.html
          node runtime/inline.mjs examples/pixel/film.html _site/pixel/film.html
          sed '/<\/title>/r _site/pixel/meta.html' _site/pixel/film.html > _site/pixel/index.html
          rm _site/pixel/film.html _site/pixel/meta.html
          grep -q 'og:image' _site/pixel/index.html
          grep -q 'inlined: ../../runtime/pixel.js' _site/pixel/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
